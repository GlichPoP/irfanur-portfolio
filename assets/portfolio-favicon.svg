<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E28465"/>
      <stop offset="100%" stop-color="#C86343"/>
    </linearGradient>
  </defs>
  <!-- Rounded Base Frame -->
  <rect width="64" height="64" rx="18" fill="url(#terracottaGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="rgba(255, 237, 231, 0.3)" stroke-width="2"/>
  
  <!-- Monogram "IR" in Bitter Serif Style -->
  <text x="32" y="42" font-family="'Bitter', Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#FAF8F5" text-anchor="middle" letter-spacing="-1">IR</text>
  
  <!-- Tiny Accent Dot -->
  <circle cx="49" cy="42" r="3" fill="#FFEDE7"/>
</svg>
